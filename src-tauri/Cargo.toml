[package]
name = "patchbay"
version = "0.13.2"
edition = "2024"
license = "Apache-2.0"
description = "Provider-agnostic desktop LLM client"

[lib]
name = "patchbay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "patchbay"
path = "src/main.rs"
required-features = ["desktop"]

# The headless daemon: `cargo build --bin patchbayd --no-default-features --features web`.
[[bin]]
name = "patchbayd"
path = "src/bin/patchbayd.rs"
required-features = ["daemon"]

[features]
default = ["desktop"]
# The native app: Tauri, its plugins and the GTK bits.
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-clipboard-manager",
    "dep:gtk",
    "dep:gdkwayland-sys",
    "dep:tray-icon",
    "dep:ashpd",
]
# Builds patchbayd. A marker so `tauri build` (which enables only `desktop`, see
# tauri.conf.json) leaves the daemon out of the app's bundles.
daemon = []
# The daemon's browser UI.
web = ["daemon", "dep:axum"]
# Tests of the window's IPC path on Tauri's mock runtime.
ipc-test = ["desktop", "tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
patchbay-llm = { path = "../crates/patchbay-llm" }
patchbay-agent = { path = "../crates/patchbay-agent" }
agent-client-protocol = { version = "=0.10.4", features = ["unstable"] }

tauri = { version = "2", features = ["tray-icon"], optional = true }
# xdg-portal instead of the default gtk3 backend: file dialogs come from the desktop's own portal
# (KDE dialogs on Plasma, GNOME ones on GNOME), with a zenity fallback when no portal runs.
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }

patchbay-mesh = { path = "../crates/patchbay-mesh" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
ignore = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
indexmap = { version = "2", features = ["serde"] }
infer = "0.19.0"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
pdf_oxide = { version = "0.3.43", features = ["rendering"] }
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
snow = "0.10.0"
spake2 = "0.4.0"
ed25519-dalek = "2"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
chacha20poly1305 = "0.10"
hex = "0.4.3"
rand = "0.8"
tar = "0.4"
urlencoding = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"], optional = true }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

# The app-drawn title bar on Wayland: KWin keeps its own title bar unless the window announces
# client-side decorations, which only GDK can do (same 0.18 versions Tauri already links).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }
gdkwayland-sys = { version = "0.18", features = ["v3_24"], optional = true }
# Tauri builds its tray on the AppIndicator backend, which never reports clicks on the icon.
# Enabling `ksni` on the same tray-icon Tauri links switches it to the StatusNotifierItem
# backend, which does, so a left click can show and hide the window.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"], optional = true }
# The quick-entry shortcut on Wayland sessions, through the GlobalShortcuts portal (same 0.11
# the dialog plugin already links).
ashpd = { version = "0.11", default-features = false, features = ["tokio"], optional = true }

[profile.dev.package."*"]
opt-level = 1
