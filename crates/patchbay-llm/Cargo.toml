[package]
name = "patchbay-llm"
version = "0.13.1"
edition = "2024"
license = "Apache-2.0"
description = "Patchbay's provider-agnostic LLM client: one conversation model over OpenAI Chat Completions, OpenAI Responses, Anthropic Messages and Gemini"

[dependencies]
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
