[package]
name = "patchbay-agent"
version = "0.13.3"
edition = "2024"
license = "Apache-2.0"
description = "Patchbay's own coding agent: an ACP server over patchbay-llm with file, search, shell, web and MCP tools"

[lib]
name = "patchbay_agent"

[[bin]]
name = "patchbay-agent"
path = "src/main.rs"

[dependencies]
patchbay-llm = { path = "../patchbay-llm" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
globset = "0.4"
htmd = "0.5"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "io-util", "fs", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
scraper = "0.29.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
