[package]
name = "tauri-plugin-remote-platform"
version = "0.13.0"
edition = "2024"
license = "Apache-2.0"
description = "Patchbay Remote's platform services: sealing keys in the Android Keystore and keeping the connection open in the background"
links = "tauri-plugin-remote-platform"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
