# Checks on every pull request (into staging and into release): static checks,
# the frontend's typecheck, build and notices, and the phone app's build. The
# Rust unit tests on Linux run only on release PRs (staging collects many
# changes before a release, and a full cold build takes about 20 minutes).
# No packages; build.yml does those for release PRs.
#
# A pull request that only touches docs skips the heavy jobs. They still report
# (as skipped), which satisfies the required checks, so the PR can merge.
name: checks

on:
  pull_request:
    branches: [staging, release]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # list the pull request's files

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether the pull request changes anything besides docs. Docs are Markdown
  # (except THIRD_PARTY_NOTICES.md, which frontend checks), docs/, LICENSE and
  # NOTICE. Anything else, a manual run, or a PR too big to list counts as source.
  changes:
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.files.outputs.source }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          source=false
          if [ -z "$PR" ] || [ "$CHANGED" -ge 3000 ]; then
            source=true
          else
            # Renames list both names, so moving a source file into docs/ counts.
            while IFS= read -r f; do
              case $f in
                THIRD_PARTY_NOTICES.md) source=true ;;
                docs/*|*.md|LICENSE|NOTICE) ;;
                *) source=true ;;
              esac
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                       -q '.[] | .filename, (.previous_filename // empty)')
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          [ "$source" = true ] || echo "Docs only: skipping the build and test jobs" >> "$GITHUB_STEP_SUMMARY"

  # release only takes what staging has: changes go feature branch -> staging
  # -> release.
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests into release must come from staging
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != staging ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::release takes pull requests from staging only (this one is from $HEAD_REPO:$HEAD_REF)"
            exit 1
          fi

  # A release is tagged v<version>, so a release PR needs a version that has
  # not been released yet.
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version is new
        run: |
          version=$(scripts/ci/version.sh)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released; bump the version (scripts/ci/version.sh lists where it lives)"
            exit 1
          fi
          echo "Releases as v$version" >> "$GITHUB_STEP_SUMMARY"

  static:
    needs: changes
    # Runs unless changes found docs only; if changes itself failed, this still runs.
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git shellcheck desktop-file-utils

      - uses: actions/checkout@v4

      - name: scripts/ci/check.sh
        run: |
          git config --global --add safe.directory "*"
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          su builder -c 'git config --global --add safe.directory "*" && scripts/ci/check.sh'

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  frontend:
    needs: changes
    # Runs unless changes found docs only; if changes itself failed, this still runs.
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Speech routing and queue regression
        run: node src/lib/speech.selftest.mjs
      - name: Third-party notices are up to date
        run: pnpm notices && git diff --exit-code -- THIRD_PARTY_NOTICES.md

  # Skipped on staging PRs; a skipped job still satisfies the required check.
  linux:
    needs: changes
    # Runs unless changes found docs only; if changes itself failed, this still runs.
    if: >-
      ${{ !cancelled() && needs.changes.outputs.source != 'false' &&
          (github.event_name != 'pull_request' || github.base_ref == 'release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/deps-ubuntu.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib --locked --features ipc-test
      - name: Unit tests of the headless build (patchbayd, no Tauri)
        working-directory: src-tauri
        run: cargo test --lib --locked --no-default-features --features web
      - name: Mesh protocol crate tests
        working-directory: crates/patchbay-mesh
        run: cargo test --locked
      - name: LLM client crate tests
        working-directory: crates/patchbay-llm
        run: cargo test --locked
      - name: Coding agent crate tests
        working-directory: crates/patchbay-agent
        run: cargo test --locked
      # The mock model speaks all four wire formats, so these exercise the client and the agent
      # end to end (and the app's Code smoke tests, which start the agent in process).
      - name: End-to-end tests against the mock model
        run: |
          python3 scripts/mock-llm.py --port 8765 &
          sleep 1
          (cd crates/patchbay-llm && cargo test --locked -- --ignored)
          (cd crates/patchbay-agent && cargo test --locked -- --ignored)
          (cd src-tauri && cargo test --lib --locked --features ipc-test smoke -- --ignored)

  # The phone app (remote/) on Linux: its frontend builds and its backend compiles. The APK
  # itself builds on release pull requests (build.yml).
  remote:
    needs: changes
    # Runs unless changes found docs only; if changes itself failed, this still runs.
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/deps-ubuntu.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:remote
      - name: Check the backend
        working-directory: remote/src-tauri
        run: cargo check --locked


  # Exercise the Android bridge as well as the controller: a desktop cargo check cannot
  # compile Kotlin or run its simulated API 26–37 lifecycle and speech tests.
  android-speech:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.source != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:remote
      - name: Build the Android bridge and debug APK
        working-directory: remote
        run: ../node_modules/.bin/tauri android build --apk --debug --target aarch64 --ci --config '{"build":{"beforeBuildCommand":""}}'
      - name: Android speech controller tests and lint
        working-directory: remote/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-remote-platform:testDebugUnitTest :tauri-plugin-remote-platform:lintDebug --console=plain
      - name: Android speech reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-speech-reports
          path: |
            remote/plugin/android/build/test-results/testDebugUnitTest/
            remote/plugin/android/build/reports/
          if-no-files-found: warn
