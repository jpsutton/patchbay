# Publish on merge into release, without rebuilding: the pull request from
# staging already ran the full build (build.yml), so this takes that run's
# artifacts, signs every one (PATCHBAY_GPG_KEY), tags the release v<version> and
# creates a GitHub Release with the packages, signatures and SHA256SUMS. The
# jpsutton pacman repository (jpsutton/arch-repo) then picks up the Arch packages. The phone app's APK is signed with its own key
# (PATCHBAY_APK_KEYSTORE) and published to the F-Droid repository on GitHub Pages
# (PATCHBAY_FDROID_KEYSTORE); without those secrets the release goes out without it.
# latest.json, the in-app updater's feed, is signed with the updater key
# (TAURI_SIGNING_PRIVATE_KEY, scripts/ci/updater-manifest.sh).
#
# Merge staging -> release pull requests with "Create a merge commit": the PR's
# head is then the merge commit's second parent, which is what this looks up.
name: release

on:
  push:
    branches: [release]

permissions:
  contents: write   # tag and release
  actions: read     # read the pull request's build run and its artifacts

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Creating the release branch is a push too; there is nothing to publish yet.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    # Includes waiting for the pull request's build to finish (about 90 minutes).
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the pull request's build
        id: build
        run: |
          set -euo pipefail
          # The Windows/macOS jobs may fail without blocking a release, so the
          # run's overall conclusion can be "failure"; the Linux jobs must pass.
          head=$(git rev-parse HEAD^2 2>/dev/null) || {
            echo "::error::$GITHUB_SHA is not a merge commit; merge staging into release with 'Create a merge commit'"
            exit 1
          }
          # The published artifacts were built from the PR head; they match
          # release only if the merge changed nothing on top of it.
          if ! git diff --quiet "$head" HEAD; then
            echo "::error::release differs from the merged staging head $head; its build would not match"
            exit 1
          fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml --commit "$head" \
                  --json databaseId,event \
                  -q 'map(select(.event == "pull_request")) | .[0].databaseId')
          [ -n "$run" ] || { echo "::error::no pull-request build for $head"; exit 1; }
          # Auto-merge lands the PR once the required checks pass, while the
          # best-effort jobs (Windows, macOS, Android) may still be building:
          # wait for the whole run, since its artifacts are what gets published.
          if [ "$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json status -q .status)" != completed ]; then
            echo "Waiting for build run $run to finish"
            gh run watch "$run" -R "$GITHUB_REPOSITORY" --interval 60 >/dev/null
          fi
          for job in linux-packages arch; do
            conclusion=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json jobs \
                           -q ".jobs[] | select(.name == \"$job\") | .conclusion")
            [ "$conclusion" = success ] || { echo "::error::build $run: $job is '$conclusion'"; exit 1; }
          done
          version=$(scripts/ci/version.sh)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released"
            exit 1
          fi
          {
            echo "run=$run"
            echo "head=$head"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Build run $run for $head, releasing v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: Download its artifacts
        run: |
          set -euo pipefail
          for name in patchbay-linux patchbay-arch; do
            gh run download "${{ steps.build.outputs.run }}" -R "$GITHUB_REPOSITORY" -n "$name" -D dist
          done
          # Windows and macOS are best effort: ship them only if they built.
          for name in patchbay-windows patchbay-macos; do
            gh run download "${{ steps.build.outputs.run }}" -R "$GITHUB_REPOSITORY" -n "$name" -D dist \
              || echo "::warning::$name was not built; releasing without it"
          done
          # Artifacts keep their bundle/<format>/ folders; release assets are flat.
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist

      # The phone app ships only signed, and always with the same key: Android refuses an
      # update signed by another one. Best effort, like Windows and macOS.
      - name: Sign the phone app
        id: apk
        env:
          KEYSTORE: ${{ secrets.PATCHBAY_APK_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.PATCHBAY_APK_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if ! gh run download "${{ steps.build.outputs.run }}" -R "$GITHUB_REPOSITORY" -n patchbay-android -D android; then
            echo "::warning::patchbay-android was not built; releasing without the phone app"
            exit 0
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::PATCHBAY_APK_KEYSTORE is not set; releasing without the phone app"
            exit 0
          fi
          unsigned=$(find android -name '*.apk' | head -n 1)
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/apk.p12"
          out="dist/patchbay-remote-${{ steps.build.outputs.version }}-arm64.apk"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/apk.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASS \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify "$out"
          rm -f "$RUNNER_TEMP/apk.p12" "$out.idsig"
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      # latest.json, the in-app updater's feed, signed with the updater key (minisign, not GPG).
      # Without the key the release goes out without it, and installed apps don't see it.
      - name: Updater feed
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; releasing without the updater feed"
            exit 0
          fi
          scripts/ci/updater-manifest.sh dist "${{ steps.build.outputs.version }}"

      - name: Sign (archlinux container)
        env:
          PATCHBAY_GPG_KEY: ${{ secrets.PATCHBAY_GPG_KEY }}
        run: |
          docker run --rm -e PATCHBAY_GPG_KEY \
            -v "$GITHUB_WORKSPACE:/src" -w /src archlinux:latest \
            scripts/ci/sign-release.sh dist
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: Tag
        run: |
          set -euo pipefail
          tag="v${{ steps.build.outputs.version }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

      - name: GitHub Release
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          for f in dist/*; do
            [ -f "$f" ] || continue
            if [ "$(stat -c %s "$f")" -lt 2147483648 ]; then
              assets+=("$f")
            else
              echo "::warning::$(basename "$f") is over GitHub's 2 GiB asset limit; not attached"
            fi
          done
          gh release create "v${{ steps.build.outputs.version }}" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Patchbay ${{ steps.build.outputs.version }}" \
            --generate-notes "${assets[@]}"

      # jpsutton/arch-repo checks for new releases hourly; this makes it publish now.
      # Best effort: needs a token that can write to that repository.
      - name: Update the pacman repository
        env:
          ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$ARCH_REPO_DISPATCH_TOKEN" ]; then
            echo "::notice::ARCH_REPO_DISPATCH_TOKEN is not set; jpsutton/arch-repo picks up the release within the hour"
            exit 0
          fi
          GH_TOKEN=$ARCH_REPO_DISPATCH_TOKEN gh api repos/jpsutton/arch-repo/dispatches -f event_type=package-released \
            || echo "::warning::could not notify jpsutton/arch-repo; it picks up the release within the hour"

      # The self-hosted F-Droid repository on GitHub Pages (gh-pages branch, /fdroid).
      - name: F-Droid repository
        if: steps.apk.outputs.apk != ''
        env:
          PATCHBAY_FDROID_KEYSTORE: ${{ secrets.PATCHBAY_FDROID_KEYSTORE }}
          PATCHBAY_FDROID_KEYSTORE_PASS: ${{ secrets.PATCHBAY_FDROID_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$PATCHBAY_FDROID_KEYSTORE" ]; then
            echo "::warning::PATCHBAY_FDROID_KEYSTORE is not set; the F-Droid repository was not updated"
            exit 0
          fi
          # Ubuntu's fdroidserver (2.2) can't read current APKs.
          pipx install fdroidserver==2.4.5
          scripts/ci/fdroid-repo.sh "${{ steps.apk.outputs.apk }}"
