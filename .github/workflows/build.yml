# Full build on pull requests into release: every package for every platform.
# Linux packages are required for a release; Windows and macOS builds are best
# effort (unsigned, not required checks): a release ships them if they built.
# release.yml publishes the artifacts of the final PR head without rebuilding.
# workflow_dispatch runs it on any branch, for testing the build itself.
name: build

on:
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

# staging is the head of the staging -> release pull request, so every merge
# into staging pushes to it and starts a new full build. Only the newest head
# matters, so a push cancels the build still running for the previous one.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # .deb, .rpm and AppImage from Tauri's bundler, plus patchbayd's .deb, .rpm and tarball. The oldest supported Ubuntu
  # (24.04) sets the glibc the packages need (2.39).
  linux-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: scripts/ci/deps-ubuntu.sh
      # The protoc Grok Build pins (vendor/grok-build/bin/protoc), the same on every platform.
      - run: scripts/ci/install-protoc.sh 29.3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vendor/grok-build -> ../../target/grok
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the grok sidecar
        run: PROFILE=release scripts/build-sidecar.sh
      - name: Build and bundle
        run: pnpm tauri build --bundles deb,rpm,appimage
      # patchbayd, the headless build, reuses the frontend and sidecar built above:
      # .deb and .rpm with its systemd units, and a tarball (its AppImage counterpart).
      - name: Build and pack patchbayd
        run: |
          sudo apt-get install -y --no-install-recommends rpm >/dev/null
          scripts/package-daemon.sh tar deb rpm
      - uses: actions/upload-artifact@v4
        with:
          name: patchbay-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/daemon/*.tar.gz
            src-tauri/target/release/bundle/daemon/*.deb
            src-tauri/target/release/bundle/daemon/*.rpm
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # Patchbay Remote, the phone app: an arm64 APK, unsigned (release.yml signs it). Best effort
  # like Windows and macOS: a release ships it if it built.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" "ndk;27.2.12479018" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote/src-tauri -> target
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:remote
      - name: Build the APK
        working-directory: remote
        run: ../node_modules/.bin/tauri android build --apk --target aarch64 --ci --config '{"build":{"beforeBuildCommand":""}}'
      - uses: actions/upload-artifact@v4
        with:
          name: patchbay-android
          path: remote/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build Arch package (archlinux container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src archlinux:latest scripts/ci/build-arch.sh
          sudo chown -R "$(id -u):$(id -g)" out
      - uses: actions/upload-artifact@v4
        with:
          name: patchbay-arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows:
    runs-on: windows-latest
    # The sidecar, the app and patchbayd build one after another, and a timed-out run saves no
    # Rust cache for the next one: 90 minutes ran out in 0.9.2 and 0.10.0.
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vendor/grok-build -> ../../target/grok
      # The protoc Grok Build pins (vendor/grok-build/bin/protoc), the same on every platform.
      - run: scripts/ci/install-protoc.sh 29.3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the grok sidecar
        run: PROFILE=release scripts/build-sidecar.sh
      - name: Build and bundle
        run: pnpm tauri build --bundles nsis,msi
      # Best effort within a best-effort job: the desktop installers ship even if this fails.
      - name: Build and pack patchbayd
        continue-on-error: true
        run: scripts/package-daemon.sh zip
      - uses: actions/upload-artifact@v4
        with:
          name: patchbay-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/daemon/*.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            vendor/grok-build -> ../../target/grok
      # The protoc Grok Build pins (vendor/grok-build/bin/protoc), the same on every platform.
      - run: scripts/ci/install-protoc.sh 29.3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the grok sidecar
        run: PROFILE=release scripts/build-sidecar.sh
      # "app" too: with dmg alone, Tauri deletes Patchbay.app after making the .dmg, and the
      # steps below verify it and pack it for the updater.
      - name: Build and bundle
        run: pnpm tauri build --bundles app,dmg
      # tauri.conf.json ad-hoc signs the bundle (signingIdentity "-"). Without a sealed
      # bundle, a downloaded copy fails Gatekeeper as "damaged" instead of "unverified".
      - name: Verify the bundle signature
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/release/bundle/macos/Patchbay.app
      # The in-app updater's download: the .app as a tarball, named after the .dmg. release.yml
      # signs it for the updater. COPYFILE_DISABLE keeps macOS's ._ metadata files out, which
      # would land inside the bundle and break its seal. Checked by unpacking and verifying.
      - name: Pack the updater tarball
        run: |
          set -euo pipefail
          bundle=src-tauri/target/release/bundle
          dmg=$(basename "$(ls "$bundle"/dmg/*.dmg)")
          out="$bundle/macos/${dmg%.dmg}.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$out" -C "$bundle/macos" Patchbay.app
          check=$(mktemp -d)
          tar -xzf "$out" -C "$check"
          codesign --verify --deep --strict "$check/Patchbay.app"
      # Best effort within a best-effort job: the desktop installers ship even if this fails.
      - name: Build and pack patchbayd
        continue-on-error: true
        run: scripts/package-daemon.sh tar
      - uses: actions/upload-artifact@v4
        with:
          name: patchbay-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/daemon/*.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
